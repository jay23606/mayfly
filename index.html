<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
    <title>mayfly</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0f">
    <link rel="icon" href="icon.svg">
    <link rel="apple-touch-icon" href="icon.svg">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app"></div>
    <div id="toast" class="toast"></div>
    <div id="incall"></div>
    <div id="callo" aria-label="Active call">
      <div class="callwindowbar"><span id="cdrag">Call · drag to move</span><button id="cpip" type="button" aria-label="Open picture-in-picture" title="Picture-in-picture" hidden>▣</button><button id="cmin" type="button" aria-label="Minimize call" title="Minimize call">↙</button></div>
      <div class="stagev">
        <video id="rv" autoplay playsinline></video>
          <video id="lv" autoplay muted playsinline tabindex="0" role="button" aria-label="Swap main and small video"></video>
          <div class="cstat" id="cstat"></div>
          <div id="callapps" aria-live="polite"></div>
      </div>
      <div class="cbar">
        <button class="icon" id="cmute" title="Mute mic" aria-label="Mute microphone"></button>
        <button class="icon" id="ccam" title="Toggle camera" aria-label="Toggle camera"></button>
          <button class="icon" id="cflip" title="Flip camera" aria-label="Flip camera"></button>
          <button class="icon" id="capps" title="Activities" aria-label="Call activities"></button>
          <button class="icon hang" id="chang" title="Hang up" aria-label="Hang up"></button>
      </div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
